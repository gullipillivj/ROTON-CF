<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roton Router - Polygon Swap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
      import { createAppKit } from 'https://esm.sh/@reown/appkit';
      import { EthersAdapter } from 'https://esm.sh/@reown/appkit-adapter-ethers';
      import { polygon } from 'https://esm.sh/@reown/appkit/networks';
      import { BrowserProvider, Contract, parseUnits, formatUnits } from 'https://esm.sh/ethers@6.13.0';

      const projectId = 'db6af3372f722385b2e4c5df24341c63';
      const CHAIN_ID = 137;
      const POLYGON_HEX_CHAIN_ID = '0x89';
      const POLYGON_ROUTER_ADDRESS = '0x7f1Aa65d88b3D62Ed5d782F7217c6FD6B036e781';
      const POOLS_POLYGON_URL = 'https://gullipillivj.github.io/ROTON-CF/pools_polygon.json';

      const POLYGON_TOKENS = [
        { symbol: 'USDC',  label: 'USDC',  address: '0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359', decimals: 6,  priceUsd: 1.0 },
        { symbol: 'XSGD',  label: 'XSGD',  address: '0x769434dcA8b37780D87A42cB9839d34c5f0212b7', decimals: 6,  priceUsd: 0.77 },
        { symbol: 'AUSD',  label: 'AUSD',  address: '0x00000000eFE302BE3ACB3b0802b61147e96572ba', decimals: 6,  priceUsd: 1.0 },
        { symbol: 'TGBP',  label: 'TGBP',  address: '0x385986a0182D605568239162757e26F357c14A38', decimals: 18, priceUsd: 1.27 },
        { symbol: 'JPYC',  label: 'JPYC',  address: '0xE6A991fF16808B8c2E5C3b1235E2F11c9C4d4092', decimals: 18, priceUsd: 0.0066 },
        { symbol: 'EURA',  label: 'EURe',  address: '0x9485aca7bbac467ad86ee365592dd75ccd3d44cc', decimals: 18, priceUsd: 1.08 },
        { symbol: 'WPOL',  label: 'WPOL',  address: '0x0d500B1d8E8eF31E21C99d1Db9A6444d3ADf1270', decimals: 18, priceUsd: 0.0763 },
        { symbol: 'WETH',  label: 'WETH',  address: '0x7ceB23fD6bC0adD59E62ac25578270cFf1b9f619', decimals: 18, priceUsd: 1679.43 },
        { symbol: 'AUDD',  label: 'AUDD',  address: '0x2d00449A5181C392e954f6224eE812a87A3C0709', decimals: 6,  priceUsd: 0.65 },
        { symbol: 'RRTR',  label: 'RRTR',  address: '0x41f00afb06cce7A7F5916f4BCe88AFe3F32A22C2', decimals: 18, priceUsd: 1.00 },
        { symbol: 'RRTRN', label: 'RRTRN', address: '0xE7c921e2f78a9BCA5e959acf4517501F426BfE30', decimals: 18, priceUsd: 1.00 }
      ];

      window.clampDecimals = function (valStr, decimals) {
        const num = Number(valStr);
        if (!Number.isFinite(num) || num <= 0) return '0';
        const dec = Math.max(0, Math.min(Number(decimals) || 6, 18));
        return Number(num.toFixed(dec)).toString();
      };

      const FALLBACK_POLYGON_POOLS = [
        { pair: 'XSGD/USDC', poolAddress: '0x1f6082db7c8f4b199e17090cd5c8831a1dad1997', type: 'v2', dex: 'v2' },
        { pair: 'WPOL/USDC', poolAddress: '0xb3fa2fEB8EB215562B3A98A7eECa4A79ECf37DFc', type: 'v2', dex: 'quickswap_v2' },
        { pair: 'JPYC/USDC', poolAddress: '0xF31AEAd34D7f7652BADc72dFeC7D6f4cB6019c98', type: 'v2', dex: 'quickswap_v2' },
        { pair: 'EURe/USDC', poolAddress: '0x2BF35dF24f2b5A5B103A86416506d4ACA3B0519b', type: 'v2', dex: 'quickswap_v2' }
      ];

      const ERC20_ABI = [
        'function symbol() view returns (string)',
        'function decimals() view returns (uint8)',
        'function balanceOf(address account) view returns (uint256)',
        'function allowance(address owner, address spender) view returns (uint256)',
        'function approve(address spender, uint256 amount) returns (bool)'
      ];

      const V2_POOL_ABI = [
        'function token0() view returns (address)',
        'function token1() view returns (address)',
        'function getReserves() view returns (uint112 reserve0, uint112 reserve1, uint32 blockTimestampLast)'
      ];

      const ROTON_ROUTER_ABI = [
        'function allowedRouters(address router) view returns (bool)',
        'function swapDirect(address poolAddress, address tokenIn, address tokenOut, uint256 amountIn, uint256 amountOutMin) external returns (uint256 amountOut)',
        'function swapViaRouter(address targetRouter, address tokenIn, address tokenOut, uint256 amountIn, uint256 amountOutMin, bytes calldata routerCalldata) external returns (uint256 amountOut)'
      ];

      let polygonPools = FALLBACK_POLYGON_POOLS;
      let lastLoggedAccountKey = '';

      const modal = createAppKit({
        adapters: [new EthersAdapter()],
        networks: [polygon],
        defaultNetwork: polygon,
        projectId,
        metadata: {
          name: 'Roton Router - Polygon Swap',
          description: 'Polygon Mainnet (137) Swap Interface',
          url: window.location.origin,
          icons: []
        },
        features: { analytics: false }
      });

      window.appKitModal = modal;
      window.BrowserProvider = BrowserProvider;
      window.Contract = Contract;
      window.parseUnits = parseUnits;
      window.formatUnits = formatUnits;
      window.ERC20_ABI = ERC20_ABI;
      window.V2_POOL_ABI = V2_POOL_ABI;
      window.ROTON_ROUTER_ABI = ROTON_ROUTER_ABI;
      window.latestTokenInBalance = 0;

      function parseChainIdValue(rawId) {
        if (rawId === undefined || rawId === null || rawId === '') return null;
        if (typeof rawId === 'string' && rawId.trim().startsWith('0x')) {
          return parseInt(rawId.trim(), 16);
        }
        const num = Number(rawId);
        return Number.isNaN(num) ? null : num;
      }

      window.getActualChainId = async function (provider) {
        const walletProvider = window.appKitModal?.getWalletProvider();
        if (walletProvider && typeof walletProvider.request === 'function') {
          try {
            const hexId = await walletProvider.request({ method: 'eth_chainId' });
            const parsed = parseChainIdValue(hexId);
            if (parsed !== null) return parsed;
          } catch (_) {}
        }
        if (provider) {
          const net = await provider.getNetwork();
          return Number(net.chainId);
        }
        return null;
      };

      window.to20Byte = function (addr) {
        if (!addr) return null;
        const trimmed = String(addr).trim();
        const hex = trimmed.startsWith('0x') || trimmed.startsWith('0X') ? trimmed.slice(2) : trimmed;
        if (!/^[0-9a-fA-F]{40,}$/.test(hex)) return null;
        return '0x' + hex.slice(-40).toLowerCase();
      };

      window.logMessage = function (msg) {
        const el = document.getElementById('consoleLog');
        if (!el) return;
        const line = document.createElement('div');
        line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        el.appendChild(line);
        el.scrollTop = el.scrollHeight;
      };

      function getTokenMetaByAddress(addr) {
        const norm = window.to20Byte(addr);
        if (!norm) return null;
        return POLYGON_TOKENS.find((t) => t.address.toLowerCase() === norm) || null;
      }

      function formatCleanTokenQty(num) {
        if (!Number.isFinite(num) || num <= 0) return '0';
        return Number(num.toPrecision(6)).toString();
      }

      function updateBalanceHint() {
        const hintEl = document.getElementById('amountInHint');
        const amountInput = document.getElementById('amountIn');
        if (!hintEl || !amountInput) return;

        const bal = Number(window.latestTokenInBalance || 0);
        const tokenInAddr = document.getElementById('tokenInAddr')?.value;
        const meta = getTokenMetaByAddress(tokenInAddr);
        const price = meta?.priceUsd || 1;
        const balUsd = bal * price;

        const entered = Number(amountInput.value);
        if (Number.isFinite(entered) && entered > bal && bal > 0) {
          hintEl.textContent = `Exceeds available $${balUsd.toFixed(2)} (${formatCleanTokenQty(bal)} ${meta?.symbol || ''})`;
          hintEl.className = 'text-[11px] font-mono text-rose-400 mt-1';
        } else {
          hintEl.textContent = `Available: $${balUsd.toFixed(2)} (${formatCleanTokenQty(bal)} ${meta?.symbol || ''})`;
          hintEl.className = 'text-[11px] font-mono text-slate-400 mt-1';
        }
      }

      window.setAmountInFraction = function (fraction) {
        const amountInput = document.getElementById('amountIn');
        if (!amountInput) return;
        const bal = Number(window.latestTokenInBalance || 0);
        if (!Number.isFinite(bal) || bal <= 0) {
          window.logMessage('[WARN] No positive balance for selected From Token.');
          return;
        }
        amountInput.value = formatCleanTokenQty(bal * fraction);
        updateBalanceHint();
      };

      window.applyUsdToAmountIn = function () {
        const usdInput = document.getElementById('usdAmount');
        const amountInput = document.getElementById('amountIn');
        const tokenInAddr = document.getElementById('tokenInAddr')?.value;
        if (!usdInput || !amountInput) return;

        const usdVal = Number(usdInput.value);
        if (!Number.isFinite(usdVal) || usdVal <= 0) {
          window.logMessage('[WARN] Enter a positive USD amount.');
          return;
        }

        const meta = getTokenMetaByAddress(tokenInAddr);
        const price = meta?.priceUsd || 1;
        amountInput.value = formatCleanTokenQty(usdVal / price);
        updateBalanceHint();
      };

      function populatePoolDropdown() {
        const poolSelect = document.getElementById('poolPresetSelect');
        const poolInput = document.getElementById('poolAddr');
        if (!poolSelect) return;

        poolSelect.innerHTML = '';
        const customOpt = document.createElement('option');
        customOpt.value = '';
        customOpt.textContent = 'Custom / Manual Pool Address';
        poolSelect.appendChild(customOpt);

        polygonPools.forEach((entry) => {
          if (!entry.poolAddress) return;
          const opt = document.createElement('option');
          opt.value = entry.poolAddress;
          const shortId = `${entry.poolAddress.slice(0, 8)}...${entry.poolAddress.slice(-6)}`;
          opt.textContent = `${entry.pair} [${entry.type || 'pool'} · ${entry.dex || 'dex'}] (${shortId})`;
          poolSelect.appendChild(opt);
        });

        matchPoolFromSelectedTokens(true);
        if (poolInput && !poolInput.value && polygonPools[0]?.poolAddress) {
          poolInput.value = polygonPools[0].poolAddress;
        }
      }

      function pairsMatch(pairStr, symIn, symOut) {
        if (!pairStr || !symIn || !symOut) return false;
        const parts = pairStr.split('/').map((s) => s.trim().toUpperCase());
        if (parts.length !== 2) return false;
        const [a, b] = parts;

        const norm = (s) => {
          if (s === 'POL' || s === 'WPOL' || s === 'MATIC' || s === 'WMATIC') return 'POL_GROUP';
          if (s === 'EURA' || s === 'EURE') return 'EUR_STABLE';
          return s;
        };

        const nIn = norm(symIn);
        const nOut = norm(symOut);
        const nA = norm(a);
        const nB = norm(b);
        return (nA === nIn && nB === nOut) || (nA === nOut && nB === nIn);
      }

      function matchPoolFromSelectedTokens(overwriteInput = true) {
        const tokenInAddr = document.getElementById('tokenInAddr').value.trim();
        const tokenOutAddr = document.getElementById('tokenOutAddr').value.trim();
        const poolSelect = document.getElementById('poolPresetSelect');
        const poolInput = document.getElementById('poolAddr');
        const statusEl = document.getElementById('poolJsonStatus');

        const metaIn = getTokenMetaByAddress(tokenInAddr);
        const metaOut = getTokenMetaByAddress(tokenOutAddr);
        const symIn = metaIn ? metaIn.symbol.toUpperCase() : '';
        const symOut = metaOut ? metaOut.symbol.toUpperCase() : '';

        const matched = polygonPools.find((entry) => pairsMatch(entry.pair, symIn, symOut));
        if (matched && matched.poolAddress) {
          if (overwriteInput && poolInput) poolInput.value = matched.poolAddress;
          if (poolSelect) poolSelect.value = matched.poolAddress;
          if (statusEl) {
            statusEl.textContent = `${matched.pair} (${matched.dex || matched.type || 'pool'}) -> ${matched.poolAddress}`;
            statusEl.className = 'text-xs font-mono text-emerald-400';
          }
        } else if (statusEl) {
          statusEl.textContent = `No preset pool for ${symIn || 'FROM'}/${symOut || 'TO'} — enter a pool address or use swapViaRouter.`;
          statusEl.className = 'text-xs font-mono text-slate-400';
        }
      }

      async function fetchPolygonPoolsJson(logResult = false) {
        const statusEl = document.getElementById('poolJsonStatus');
        try {
          const resp = await fetch(`${POOLS_POLYGON_URL}?t=${Date.now()}`, { cache: 'no-store' });
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const json = await resp.json();
          const list = Array.isArray(json)
            ? json
            : Array.isArray(json?.pools)
              ? json.pools
              : json?.[String(CHAIN_ID)] || json?.[CHAIN_ID];

          if (Array.isArray(list) && list.length > 0) {
            polygonPools = list;
            populatePoolDropdown();
            if (logResult) window.logMessage('[POOLS] Loaded pools_polygon.json.');
          } else {
            throw new Error('Unexpected JSON format');
          }
        } catch (err) {
          polygonPools = FALLBACK_POLYGON_POOLS;
          populatePoolDropdown();
          if (statusEl) {
            statusEl.textContent = `Using fallback pools (${err.message})`;
            statusEl.className = 'text-xs font-mono text-amber-400';
          }
          if (logResult) window.logMessage(`[POOLS] Fallback active (${err.message}).`);
        }
      }

      function populateTokenSelectors() {
        const tokenInSelect = document.getElementById('tokenInSelect');
        const tokenOutSelect = document.getElementById('tokenOutSelect');
        const tokenInAddr = document.getElementById('tokenInAddr');
        const tokenOutAddr = document.getElementById('tokenOutAddr');
        if (!tokenInSelect || !tokenOutSelect) return;

        const knownSymbols = new Set(POLYGON_TOKENS.map((t) => t.symbol.toUpperCase()));
        const extraTokens = [];

        (polygonPools || []).forEach((entry) => {
          const parts = String(entry.pair || '').split('/');
          parts.forEach((rawSym) => {
            const cleanSym = rawSym.replace(/\(.*\)/g, '').trim();
            const upper = cleanSym.toUpperCase();
            if (!upper || knownSymbols.has(upper)) return;
            knownSymbols.add(upper);
            const dec = entry.decimals?.[cleanSym] ?? entry.decimals?.[upper] ?? 18;
            extraTokens.push({
              symbol: cleanSym,
              label: cleanSym,
              address: '0x0000000000000000000000000000000000000000',
              decimals: Number(dec) || 18,
              priceUsd: 1.0
            });
          });
        });

        const allTokens = [...POLYGON_TOKENS, ...extraTokens];
        tokenInSelect.innerHTML = '';
        tokenOutSelect.innerHTML = '';

        allTokens.forEach((t) => {
          const optIn = document.createElement('option');
          optIn.value = t.address;
          optIn.dataset.symbol = t.symbol;
          optIn.textContent = t.label;
          tokenInSelect.appendChild(optIn);

          const optOut = document.createElement('option');
          optOut.value = t.address;
          optOut.dataset.symbol = t.symbol;
          optOut.textContent = t.label;
          tokenOutSelect.appendChild(optOut);
        });

        tokenInSelect.selectedIndex = 0;
        tokenOutSelect.selectedIndex = 1;
        if (tokenInAddr) tokenInAddr.value = allTokens[0].address;
        if (tokenOutAddr) tokenOutAddr.value = allTokens[1].address;
      }

      window.refreshWalletBalances = async function () {
        const inBalEl = document.getElementById('tokenInBalLabel');
        const outBalEl = document.getElementById('tokenOutBalLabel');
        const nativeUsdEl = document.getElementById('nativePolUsdLabel');
        const modal = window.appKitModal;
        const walletProvider = modal?.getWalletProvider();
        const userAddr = window.userAddress || modal?.getAddress();

        if (!walletProvider || !userAddr) {
          window.latestTokenInBalance = 0;
          if (inBalEl) inBalEl.textContent = '$0.00';
          if (outBalEl) outBalEl.textContent = '$0.00';
          if (nativeUsdEl) nativeUsdEl.textContent = 'Wallet POL Value: $0.00';
          updateBalanceHint();
          return;
        }

        try {
          const provider = new BrowserProvider(walletProvider);
          const actualChain = await window.getActualChainId(provider);
          if (actualChain !== CHAIN_ID) {
            if (inBalEl) inBalEl.textContent = 'Switch to 137';
            if (outBalEl) outBalEl.textContent = 'Switch to 137';
            return;
          }

          const normUser = window.to20Byte(userAddr);
          const tokenInAddr = window.to20Byte(document.getElementById('tokenInAddr')?.value?.trim());
          const tokenOutAddr = window.to20Byte(document.getElementById('tokenOutAddr')?.value?.trim());

          const nativeWei = await provider.getBalance(normUser);
          const nativeQty = Number(formatUnits(nativeWei, 18));
          if (nativeUsdEl) {
            nativeUsdEl.textContent = `Wallet POL Value: $${(nativeQty * 0.0763).toFixed(2)}`;
          }

          if (tokenInAddr && inBalEl) {
            const cIn = new Contract(tokenInAddr, ERC20_ABI, provider);
            const [rawIn, decIn] = await Promise.all([
              cIn.balanceOf(normUser),
              cIn.decimals().catch(() => 18)
            ]);
            const qtyIn = Number(formatUnits(rawIn, Number(decIn)));
            window.latestTokenInBalance = qtyIn;
            const metaIn = getTokenMetaByAddress(tokenInAddr);
            inBalEl.textContent = `$${(qtyIn * (metaIn?.priceUsd || 1)).toFixed(2)}`;
          }

          if (tokenOutAddr && outBalEl) {
            const cOut = new Contract(tokenOutAddr, ERC20_ABI, provider);
            const [rawOut, decOut] = await Promise.all([
              cOut.balanceOf(normUser),
              cOut.decimals().catch(() => 18)
            ]);
            const qtyOut = Number(formatUnits(rawOut, Number(decOut)));
            const metaOut = getTokenMetaByAddress(tokenOutAddr);
            outBalEl.textContent = `$${(qtyOut * (metaOut?.priceUsd || 1)).toFixed(2)}`;
          }

          updateBalanceHint();
        } catch (_) {}
      };

      function setNetworkUiState(chainId) {
        const statusEl = document.getElementById('status-msg');
        const switchBtn = document.getElementById('switch-polygon-btn');
        if (chainId === CHAIN_ID) {
          if (switchBtn) switchBtn.hidden = true;
          if (statusEl) {
            statusEl.textContent = 'Network: Polygon Mainnet (137)';
            statusEl.className = 'text-xs font-mono text-emerald-400';
          }
        } else if (chainId !== null) {
          if (switchBtn) switchBtn.hidden = false;
          if (statusEl) {
            statusEl.textContent = `Wrong chain (${chainId}) — switch to Polygon (137)`;
            statusEl.className = 'text-xs font-mono text-amber-400';
          }
        }
      }

      window.forceSwitchToPolygon = async function () {
        const walletProvider = window.appKitModal?.getWalletProvider();
        try {
          if (walletProvider && typeof walletProvider.request === 'function') {
            await walletProvider.request({
              method: 'wallet_switchEthereumChain',
              params: [{ chainId: POLYGON_HEX_CHAIN_ID }]
            });
          } else if (window.appKitModal?.switchNetwork) {
            await window.appKitModal.switchNetwork(polygon);
          }
          const provider = walletProvider ? new BrowserProvider(walletProvider) : null;
          const activeChain = await window.getActualChainId(provider);
          setNetworkUiState(activeChain);
          if (activeChain === CHAIN_ID) {
            await window.refreshWalletBalances();
            return true;
          }
          return false;
        } catch (err) {
          window.logMessage(`[WARN] Switch failed: ${err?.shortMessage || err?.message || err}`);
          return false;
        }
      };

      function syncExecModeUi() {
        const mode = document.getElementById('execModeSelect')?.value || 'direct';
        const routerViaBox = document.getElementById('viaRouterFields');
        if (routerViaBox) {
          routerViaBox.classList.toggle('hidden', mode === 'direct');
        }
      }

      window.addEventListener('DOMContentLoaded', async () => {
        document.getElementById('routerAddr').value = POLYGON_ROUTER_ADDRESS;
        populateTokenSelectors();
        populatePoolDropdown();
        syncExecModeUi();
        updateBalanceHint();
        await fetchPolygonPoolsJson(false);

        const connectBtn = document.getElementById('connect-wallet');
        const disconnectBtn = document.getElementById('disconnect-wallet');
        const switchPolygonBtn = document.getElementById('switch-polygon-btn');
        const execModeSelect = document.getElementById('execModeSelect');
        const tokenInSelect = document.getElementById('tokenInSelect');
        const tokenOutSelect = document.getElementById('tokenOutSelect');
        const tokenInAddr = document.getElementById('tokenInAddr');
        const tokenOutAddr = document.getElementById('tokenOutAddr');
        const poolPresetSelect = document.getElementById('poolPresetSelect');
        const poolAddr = document.getElementById('poolAddr');
        const applyUsdBtn = document.getElementById('applyUsdBtn');
        const amountIn = document.getElementById('amountIn');
        const reloadPoolsBtn = document.getElementById('reloadPoolsBtn');

        if (execModeSelect) execModeSelect.addEventListener('change', syncExecModeUi);
        if (connectBtn) {
          connectBtn.hidden = false;
          connectBtn.addEventListener('click', () => modal.open());
        }
        if (disconnectBtn) {
          disconnectBtn.addEventListener('click', async () => modal.disconnect());
        }
        if (switchPolygonBtn) {
          switchPolygonBtn.addEventListener('click', async () => window.forceSwitchToPolygon());
        }

        tokenInSelect.addEventListener('change', (e) => {
          tokenInAddr.value = e.target.value;
          matchPoolFromSelectedTokens(true);
          window.refreshWalletBalances();
        });

        tokenOutSelect.addEventListener('change', (e) => {
          tokenOutAddr.value = e.target.value;
          matchPoolFromSelectedTokens(true);
          window.refreshWalletBalances();
        });

        tokenInAddr.addEventListener('input', () => {
          matchPoolFromSelectedTokens(false);
          window.refreshWalletBalances();
        });

        tokenOutAddr.addEventListener('input', () => {
          matchPoolFromSelectedTokens(false);
          window.refreshWalletBalances();
        });

        if (applyUsdBtn) applyUsdBtn.addEventListener('click', () => window.applyUsdToAmountIn());
        if (amountIn) amountIn.addEventListener('input', () => updateBalanceHint());

        poolPresetSelect.addEventListener('change', (e) => {
          if (e.target.value) poolAddr.value = e.target.value;
        });

        reloadPoolsBtn.addEventListener('click', () => fetchPolygonPoolsJson(true));
      });

      modal.subscribeAccount(async (state) => {
        const connectBtn = document.getElementById('connect-wallet');
        const disconnectBtn = document.getElementById('disconnect-wallet');
        const switchBtn = document.getElementById('switch-polygon-btn');
        const addressEl = document.getElementById('wallet-address');
        const statusEl = document.getElementById('status-msg');

        if (state.isConnected && state.address) {
          window.userAddress = window.to20Byte(state.address) || state.address;
          if (connectBtn) {
            connectBtn.textContent = `${state.address.slice(0, 6)}...${state.address.slice(-4)}`;
            connectBtn.className =
              'px-5 py-2.5 rounded-xl font-semibold bg-slate-800 text-emerald-400 border border-slate-700 cursor-pointer transition';
          }
          if (disconnectBtn) disconnectBtn.hidden = false;
          if (addressEl) {
            addressEl.textContent = `Connected: ${state.address}`;
            addressEl.hidden = false;
          }

          const provider = modal.getWalletProvider() ? new BrowserProvider(modal.getWalletProvider()) : null;
          const actualChain = (await window.getActualChainId(provider)) ?? parseChainIdValue(state.chainId);
          setNetworkUiState(actualChain);

          const accountKey = `${state.address.toLowerCase()}:${actualChain ?? ''}`;
          if (accountKey !== lastLoggedAccountKey) {
            lastLoggedAccountKey = accountKey;
            window.logMessage(`[WALLET] Connected: ${state.address}`);
            await window.refreshWalletBalances();
          }
        } else {
          window.userAddress = null;
          window.latestTokenInBalance = 0;
          if (connectBtn) {
            connectBtn.textContent = 'Connect Wallet';
            connectBtn.className =
              'px-5 py-2.5 rounded-xl font-semibold bg-white text-slate-950 hover:bg-slate-200 cursor-pointer transition';
          }
          if (disconnectBtn) disconnectBtn.hidden = true;
          if (switchBtn) switchBtn.hidden = true;
          if (addressEl) {
            addressEl.textContent = '';
            addressEl.hidden = true;
          }
          if (statusEl) statusEl.textContent = '';
          updateBalanceHint();
          if (lastLoggedAccountKey !== '') {
            lastLoggedAccountKey = '';
            window.logMessage('[WALLET] Disconnected.');
          }
        }
      });

      modal.subscribeNetwork((networkState) => {
        const parsedId = parseChainIdValue(networkState?.chainId);
        if (parsedId !== null) {
          setNetworkUiState(parsedId);
          if (parsedId === CHAIN_ID) window.refreshWalletBalances();
        }
      });
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8 font-sans">

          <div>

          </div>
          <div>

            <input
              type="text"

        <details open class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3.5">
          <summary class="text-xs font-semibold text-slate-300 cursor-pointer select-none">

          <div class="mt-3 space-y-3">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
              <div>
                <label class="block text-xs text-slate-400 mb-1">Roton Router</label>
                <input
                  type="text"
                  id="routerAddr"
                  value="0x7f1Aa65d88b3D62Ed5d782F7217c6FD6B036e781"
                  class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs font-mono text-slate-200"

              <div>
                <label class="block text-xs text-slate-400 mb-1">Execution Mode</label>
                <select
                  id="execModeSelect"
                  class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs font-mono text-slate-200"
                >
                  <option value="direct" selected>swapDirect (V2 Pool)</option>
                  <option value="via_router">swapViaRouter (Target Router + Calldata)</option>
                </select>
              </div>
              <div>
                <label class="block text-xs text-slate-400 mb-1">Slippage</label>
                <select
                  id="slippagePct"

                >
                  <option value="1" selected>1% Slippage</option>

            <div id="viaRouterFields" class="hidden space-y-2.5 pt-2 border-t border-slate-800">

                  type="text"

        <button

          Swap

      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
        <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Console Log</h3>
        <div
          id="consoleLog"
          class="bg-slate-950 border border-slate-800 rounded-xl p-4 font-mono text-xs text-emerald-400 min-h-[150px] max-h-[280px] overflow-y-auto space-y-1"
        >
          <div>[SYSTEM] Polygon (137) testbench ready. Connect wallet to begin...</div>
        </div>
      </div>
    </div>

    <script type="module">
      import { Contract, parseUnits, formatUnits } from 'https://esm.sh/ethers@6.13.0';

      function getWalletContext() {
        const modal = window.appKitModal;
        const walletProvider = modal?.getWalletProvider();
        const rawAddr = window.userAddress || modal?.getAddress();
        const userAddress = window.to20Byte(rawAddr);
        if (!walletProvider || !userAddress) {
          window.logMessage('[WARN] Please connect your wallet first.');
          if (modal) modal.open();
          return null;
        }
        return { walletProvider, userAddress };
      }

      document.getElementById('inspectPoolBtn').addEventListener('click', async () => {
        const ctx = getWalletContext();
        if (!ctx) return;

        const routerAddr = window.to20Byte(document.getElementById('routerAddr')?.value);
        const targetRouterAddr = window.to20Byte(document.getElementById('targetRouterAddr')?.value);
        const poolAddr = window.to20Byte(document.getElementById('poolAddr')?.value);

        try {
          const provider = new window.BrowserProvider(ctx.walletProvider);
          const actualChain = await window.getActualChainId(provider);
          if (actualChain !== 137) {
            await window.forceSwitchToPolygon();
            return;
          }

          if (routerAddr && targetRouterAddr) {
            const router = new Contract(routerAddr, window.ROTON_ROUTER_ABI, provider);
            const allowed = await router.allowedRouters(targetRouterAddr).catch(() => false);
            window.logMessage(`[ROUTE] allowedRouters(${targetRouterAddr}) = ${allowed}`);
          }

          if (!poolAddr) {
            window.logMessage('[INFO] No pool address entered.');
            return;
          }

          const code = await provider.getCode(poolAddr);
          if (!code || code === '0x') {
            window.logMessage(`[WARN] No contract at ${poolAddr} on Polygon.`);
            return;
          }

          try {
            const pool = new Contract(poolAddr, window.V2_POOL_ABI, provider);
            const [t0, t1, reserves] = await Promise.all([pool.token0(), pool.token1(), pool.getReserves()]);
            window.logMessage(`[ROUTE] V2 pair: token0=${t0} | token1=${t1} | r0=${reserves[0]} | r1=${reserves[1]}`);
          } catch (_) {
            window.logMessage(`[ROUTE] ${poolAddr} does not use V2 getReserves() (use swapViaRouter with targetRouter & calldata).`);
          }
        } catch (err) {
          window.logMessage(`[ERROR] ${err.shortMessage || err.message}`);
        }
      });

      document.getElementById('execBtn').addEventListener('click', async () => {
        const ctx = getWalletContext();
        if (!ctx) return;

        const routerAddr = window.to20Byte(document.getElementById('routerAddr')?.value);
        const tokenInAddr = window.to20Byte(document.getElementById('tokenInAddr')?.value);
        const tokenOutAddr = window.to20Byte(document.getElementById('tokenOutAddr')?.value);
        const poolAddr = window.to20Byte(document.getElementById('poolAddr')?.value);
        const targetRouterAddr = window.to20Byte(document.getElementById('targetRouterAddr')?.value);
        const routerCalldata = (document.getElementById('routerCalldataInput')?.value || '').trim();
        const execMode = document.getElementById('execModeSelect')?.value || 'direct';
        const humanAmountIn = (document.getElementById('amountIn')?.value || '').trim();
        const slippageVal = Number(document.getElementById('slippagePct')?.value || 1);

        if (!routerAddr || !tokenInAddr || !tokenOutAddr) {
          window.logMessage('[WARN] Check Router, From Token, and To Token addresses.');
          return;
        }
        if (tokenInAddr === tokenOutAddr) {
          window.logMessage('[WARN] From Token and To Token must be different.');
          return;
        }
        if (!humanAmountIn || Number(humanAmountIn) <= 0) {
          window.logMessage('[WARN] Enter a positive amount to swap.');
          return;
        }

        try {
          const provider = new window.BrowserProvider(ctx.walletProvider);
          let actualChain = await window.getActualChainId(provider);
          if (actualChain !== 137) {
            const switched = await window.forceSwitchToPolygon();
            actualChain = await window.getActualChainId(provider);
            if (!switched || actualChain !== 137) {
              window.logMessage(`[WARN] Please switch wallet to Polygon (137).`);
              return;
            }
          }

          const signer = await provider.getSigner();
          const tokenIn = new Contract(tokenInAddr, window.ERC20_ABI, signer);
          const decimals = Number(await tokenIn.decimals().catch(() => 18));
          const cleanAmountIn = window.clampDecimals(humanAmountIn, decimals);
          const amountInWei = parseUnits(cleanAmountIn, decimals);

          const walletBalWei = await tokenIn.balanceOf(ctx.userAddress);
          if (walletBalWei < amountInWei) {
            window.logMessage(
              `[WARN] Balance (${formatUnits(walletBalWei, decimals)}) is lower than ${cleanAmountIn}.`
            );
            return;
          }

          const currentAllowance = await tokenIn.allowance(ctx.userAddress, routerAddr);
          if (currentAllowance < amountInWei) {
            window.logMessage(`[APPROVE] Approving ${cleanAmountIn}...`);
            const approveTx = await tokenIn.approve(routerAddr, amountInWei, { gasLimit: 100000n });
            window.logMessage(`[APPROVE] Sent: ${approveTx.hash}`);
            await approveTx.wait();
            window.logMessage('[APPROVE] Confirmed.');
          }

          const router = new Contract(routerAddr, window.ROTON_ROUTER_ABI, signer);
          const amountToSwapWei = amountInWei - (amountInWei * 5n) / 10000n;
          const bps = slippageVal === 2 ? 200n : 100n;

          if (execMode === 'via_router') {
            if (!targetRouterAddr || !routerCalldata || !routerCalldata.startsWith('0x') || routerCalldata.length < 10) {
              window.logMessage('[WARN] Enter Target Router and hex Router Calldata (0x...) for swapViaRouter.');
              return;
            }
            const isAllowed = await router.allowedRouters(targetRouterAddr).catch(() => false);
            if (!isAllowed) {
              window.logMessage(`[WARN] Target Router ${targetRouterAddr} is not allowlisted yet.`);
              return;
            }

            window.logMessage('[SWAP] Sending swapViaRouter to wallet...');
            const swapTx = await router.swapViaRouter(
              targetRouterAddr,
              tokenInAddr,
              tokenOutAddr,
              amountInWei,
              1n,
              routerCalldata,
              { gasLimit: 320000n }
            );
            window.logMessage(`[SWAP] Tx hash: ${swapTx.hash}`);
            const receipt = await swapTx.wait();
            window.logMessage(`[SUCCESS] Confirmed in block ${receipt.blockNumber}!`);
          } else {
            if (!poolAddr) {
              window.logMessage('[WARN] Enter a Pool Address for swapDirect.');
              return;
            }

            let minOutWei = 1n;
            try {
              const pool = new Contract(poolAddr, window.V2_POOL_ABI, provider);
              const [t0, t1, reserves] = await Promise.all([pool.token0(), pool.token1(), pool.getReserves()]);
              const t0Lower = t0.toLowerCase();
              const t1Lower = t1.toLowerCase();
              if ((tokenInAddr === t0Lower || tokenInAddr === t1Lower) && (tokenOutAddr === t0Lower || tokenOutAddr === t1Lower)) {
                const isToken0 = tokenInAddr === t0Lower;
                const reserveIn = BigInt(isToken0 ? reserves[0] : reserves[1]);
                const reserveOut = BigInt(isToken0 ? reserves[1] : reserves[0]);
                if (reserveIn > 0n && reserveOut > 0n) {
                  const amountInWithFee = amountToSwapWei * 997n;
                  const expectedOutWei = (amountInWithFee * reserveOut) / (reserveIn * 1000n + amountInWithFee);
                  minOutWei = (expectedOutWei * (10000n - bps)) / 10000n;
                  if (minOutWei < 1n) minOutWei = 1n;
                }
              }
            } catch (_) {
              minOutWei = 1n;
            }

            window.logMessage('[SWAP] Sending swapDirect to wallet...');
            const swapTx = await router.swapDirect(
              poolAddr,
              tokenInAddr,
              tokenOutAddr,
              amountInWei,
              minOutWei,
              { gasLimit: 220000n }
            );
            window.logMessage(`[SWAP] Tx hash: ${swapTx.hash}`);
            const receipt = await swapTx.wait();
            window.logMessage(`[SUCCESS] Confirmed in block ${receipt.blockNumber}!`);
          }

          await window.refreshWalletBalances();
        } catch (err) {
          window.logMessage(`[ERROR] ${err.shortMessage || err.message}`);
        }
      });
    </script>
