<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roton Router - Multi-Chain Swap Testbench</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
      import { createAppKit } from 'https://esm.sh/@reown/appkit';
      import { EthersAdapter } from 'https://esm.sh/@reown/appkit-adapter-ethers';
      import { mainnet, bsc, polygon } from 'https://esm.sh/@reown/appkit/networks';
      import { BrowserProvider, Contract, parseUnits, formatUnits } from 'https://esm.sh/ethers@6.13.0';

      const projectId = 'db6af3372f722385b2e4c5df24341c63';
      const POOLS_JSON_URL = 'https://gullipillivj.github.io/ROTON-CF/pools.json';

      const NETWORKS = {
        56: bsc,
        137: polygon,
        1: mainnet
      };

      const ROUTERS_BY_CHAIN = {
        56: '0x6c1F7E61Ce370414807e2a8Dd7a746F00dc7B56B',
        137: '0x7f1Aa65d88b3D62Ed5d782F7217c6FD6B036e781'
      };

      // Token lists per chain (native gas marked with isNative: true)
      const TOKENS_BY_CHAIN = {
        56: [
          { symbol: 'WBNB', address: '0xbb4CdB9CBd36B01bD1cBaEBF2De08d9173bc095c', decimals: 18 },
          { symbol: 'BNB (Native)', address: 'NATIVE', decimals: 18, isNative: true, wrappedAddress: '0xbb4CdB9CBd36B01bD1cBaEBF2De08d9173bc095c' },
          { symbol: 'USDT', address: '0x55d398326f99059fF775485246999027B3197955', decimals: 18 },
          { symbol: 'USDC', address: '0x8ac76a51cc950d9822d68b83fe1ad97b32cd580d', decimals: 18 },
          { symbol: 'CAKE', address: '0x0e09fabb73bd3ade0a17ecc321fd13a19e81ce82', decimals: 18 },
          { symbol: 'WETH (ETH)', address: '0x2170ed0880ac9a755fd29b2688956bd959f933f8', decimals: 18 },
          { symbol: 'BTCB', address: '0x7130d2a12b9bcbfae4f2634d864a1ee1ce3ead9c', decimals: 18 },
          { symbol: 'RRTR', address: '0x41f00afb06cce7A7F5916f4BCe88AFe3F32A22C2', decimals: 18 },
          { symbol: 'RRTRN', address: '0xE7c921e2f78a9BCA5e959acf4517501F426BfE30', decimals: 18 },
          { symbol: 'JPYC', address: '0xd3f65678abd59e8990a761ae9a6f6caafae54444', decimals: 18 },
          { symbol: 'EURC / EURE', address: '0x8a972ed397bed7c0cbc84cc3efbc760bb07f80bb', decimals: 18 },
          { symbol: 'XSGD', address: '0x7d6fa5b66d581c817293a3880629df8350bc822a', decimals: 18 },
          { symbol: 'TGBP', address: '0x8a972ed397bed7c0cbc84cc3efbc760bb07f80bb', decimals: 18 },
          { symbol: 'AUDD', address: '0x4cce605ed955295432958d8951d0b176c10720d5', decimals: 18 },
          { symbol: 'AUSD', address: '0x00000000eFE302BEAA2b3e6e1b18d08D69a9012a', decimals: 6 }
        ],
        137: [
          { symbol: 'WPOL', address: '0x0d500B1d8E8eF31E21C99d1Db9A6444d3ADf1270', decimals: 18 },
          { symbol: 'POL (Native)', address: 'NATIVE', decimals: 18, isNative: true, wrappedAddress: '0x0d500B1d8E8eF31E21C99d1Db9A6444d3ADf1270' },
          { symbol: 'USDC', address: '0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359', decimals: 6 },
          { symbol: 'USDT', address: '0xc2132D05D31c914a87C6611C10748AEb04B58e8F', decimals: 6 },
          { symbol: 'RRTR', address: '0x41f00afb06cce7A7F5916f4BCe88AFe3F32A22C2', decimals: 18 },
          { symbol: 'RRTRN', address: '0xE7c921e2f78a9BCA5e959acf4517501F426BfE30', decimals: 18 },
          { symbol: 'JPYC', address: '0xE7C3D8C9a439feDe00D2600032D5dB0Be71C3c29', decimals: 18 },
          { symbol: 'EURA', address: '0xE0B52e49357Fd4DAf2c15e02058DCE6BC0057db4', decimals: 18 },
          { symbol: 'XSGD', address: '0xDC3326e71D45186F113a2F448984CA0e8D201995', decimals: 6 },
          { symbol: 'TGBP', address: '0x27f6c8289550fCE67f6B50BeD1F519966aFE5287', decimals: 18 },
          { symbol: 'AUDD', address: '0x4cce605ed955295432958d8951d0b176c10720d5', decimals: 18 },
          { symbol: 'AUSD', address: '0x00000000eFE302BEAA2b3e6e1b18d08D69a9012a', decimals: 6 }
        ]
      };

      // Fallback mirror of pools.json in case offline/fetch fails
      const FALLBACK_POOLS_JSON = {
        56: [
          { pair: 'WBNB/USDT', poolAddress: '0x16b9a82891338f9ba80e2d6970fdda79d1eb0dae', type: 'v2', dex: 'pancakeswap_v2' },
          { pair: 'RRTR/RRTRN', poolAddress: '0x4444b60b02493Bc615238ae58d366FD33a271B64', type: 'v2', dex: 'v2' },
          { pair: 'RRTR/USDT', poolAddress: '0x6a3223555f0c2d7cd79c465c7a984a78e3bbb1c64daabb56ffb0b3baf3790bb0', type: 'bytes32_pool_id', dex: 'pancakeswap_infinity' },
          { pair: 'RRTR/USDC', poolAddress: '0xa05493fb96792e68b8317b3b1e306e0223d140143b166ae3e89ad0af06e5b05e', type: 'bytes32_pool_id', dex: 'pancakeswap_infinity' },
          { pair: 'RRTR/WBNB', poolAddress: '0xd7eb30623259ab43dcdd5f2749fdb5c9c864c954a42288ccb5869ec8efbf649f', type: 'bytes32_pool_id', dex: 'pancakeswap_infinity' },
          { pair: 'RRTR/BTCB', poolAddress: '0x1f0d715d8eb4389204109fe9d4743aaac6c1299885f02e0a555ebfdd0353bc15', type: 'bytes32_pool_id', dex: 'pancakeswap_infinity' },
          { pair: 'RRTR/CAKE', poolAddress: '0x7323c830ca97607fe27b2a00a270ae89ae9e2228bb62008fd6c65cd08d41d654', type: 'bytes32_pool_id', dex: 'pancakeswap_infinity' },
          { pair: 'RRTR/BNB', poolAddress: '0x8458c564a063865e437200adeb300dfe4b3841b0e5dac6ed808af51ed1beef95', type: 'bytes32_pool_id', dex: 'pancakeswap_infinity' }
        ],
        137: [
          { pair: 'AUSD/RRTR', poolAddress: '0x91b072951efFdd971F7569677c3dE54F55a1f52e', type: 'v2', dex: 'quickswap_v2' },
          { pair: 'RRTR/USDC', poolAddress: '0x98f4980e9bA408867FE8C46831ec7D9211b6D07A', type: 'v2', dex: 'quickswap_v2' },
          { pair: 'RRTR/RRTRN', poolAddress: '0x4444b60b02493Bc615238ae58d366FD33a271B64', type: 'v2', dex: 'quickswap_v2' },
          { pair: 'EURe/USDC', poolAddress: '0x2BF35dF24f2b5A5B103A86416506d4ACA3B0519b', type: 'v2', dex: 'quickswap_v2' },
          { pair: 'TGBP/USDC', poolAddress: '0x66b1b1e1d030d36cae831b19c07fcf79bb842abb', type: 'v2', dex: 'v2' },
          { pair: 'XSGD/USDC', poolAddress: '0x1f6082db7c8f4b199e17090cd5c8831a1dad1997', type: 'v2', dex: 'v2' },
          { pair: 'JPYC/USDC', poolAddress: '0xF31AEAd34D7f7652BADc72dFeC7D6f4cB6019c98', type: 'v2', dex: 'quickswap_v2' },
          { pair: 'EURA/WPOL', poolAddress: '0x9c6270ea8E17aaf7BA14dc8E36f6517b9Ad9472A', type: 'v2', dex: 'quickswap_v2' },
          { pair: 'JPYC/USDC (CoinGecko ID)', poolAddress: '0x4643e3152a6ea3957e087cefbba74a1c628aa643e6b8a0edfae23a5796dde012', type: 'bytes32_pool_id', dex: 'non_v2' },
          { pair: 'EURe/USDC (CoinGecko ID)', poolAddress: '0x85bc73101215a4fb4cbfd7cc71e514212c18de68863f70e5512d4b98f8f2cb88', type: 'bytes32_pool_id', dex: 'non_v2' }
        ]
      };

      const ERC20_ABI = [
        'function symbol() view returns (string)',
        'function decimals() view returns (uint8)',
        'function balanceOf(address account) view returns (uint256)',
        'function allowance(address owner, address spender) view returns (uint256)',
        'function approve(address spender, uint256 amount) returns (bool)'
      ];
      const V2_POOL_ABI = [
        'function token0() view returns (address)',
        'function token1() view returns (address)',
        'function getReserves() view returns (uint112 reserve0, uint112 reserve1, uint32 blockTimestampLast)'
      ];
      const ROTON_ROUTER_ABI = [
        'function swapDirect(address poolAddress, address tokenIn, address tokenOut, uint256 amountIn, uint256 amountOutMin) external returns (uint256 amountOut)'
      ];

      let poolsByChain = FALLBACK_POOLS_JSON;
      let activeChainId = 56;
      let lastLoggedAccountKey = '';

      const metadata = {
        name: 'Roton Router Testbench',
        description: 'Reown AppKit Wallet Connection & Multi-Chain Swap Testbench',
        url: window.location.origin,
        icons: []
      };

      const modal = createAppKit({
        adapters: [new EthersAdapter()],
        networks: [bsc, polygon, mainnet],
        defaultNetwork: bsc,
        projectId,
        metadata,
        features: {
          analytics: false
        }
      });

      window.appKitModal = modal;
      window.BrowserProvider = BrowserProvider;
      window.Contract = Contract;
      window.parseUnits = parseUnits;
      window.formatUnits = formatUnits;
      window.ERC20_ABI = ERC20_ABI;
      window.V2_POOL_ABI = V2_POOL_ABI;
      window.ROTON_ROUTER_ABI = ROTON_ROUTER_ABI;

      window.logMessage = function (msg) {
        const el = document.getElementById('consoleLog');
        if (!el) return;
        const line = document.createElement('div');
        line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        el.appendChild(line);
        el.scrollTop = el.scrollHeight;
      };

      function getTokenSymbolByAddress(chainId, addr) {
        if (!addr) return '';
        const lower = addr.toLowerCase();
        if (lower === 'native') return chainId === 137 ? 'POL' : 'BNB';
        const list = TOKENS_BY_CHAIN[chainId] || [];
        const found = list.find((t) => t.address.toLowerCase() === lower);
        if (!found) return '';
        return found.symbol.split('/')[0].split(' ')[0].trim();
      }

      function populatePoolDropdown(chainId) {
        const poolSelect = document.getElementById('poolPresetSelect');
        const poolInput = document.getElementById('poolAddr');
        if (!poolSelect) return;

        const entries = poolsByChain[String(chainId)] || poolsByChain[chainId] || [];
        poolSelect.innerHTML = '';

        const customOpt = document.createElement('option');
        customOpt.value = '';
        customOpt.textContent = 'Custom / Manual Pool Address';
        poolSelect.appendChild(customOpt);

        entries.forEach((entry) => {
          const opt = document.createElement('option');
          opt.value = entry.poolAddress || '';
          const shortAddr = entry.poolAddress
            ? `${entry.poolAddress.slice(0, 8)}...${entry.poolAddress.slice(-6)}`
            : 'N/A';
          const tag = entry.type === 'v2' ? 'V2' : 'bytes32-ID';
          opt.textContent = `${entry.pair} [${tag}] (${shortAddr})`;
          poolSelect.appendChild(opt);
        });

        // Default to first 20-byte V2 pool on the active chain if available
        const firstV2 = entries.find((e) => e.poolAddress && e.poolAddress.length === 42);
        if (firstV2 && poolInput) {
          poolSelect.value = firstV2.poolAddress;
          poolInput.value = firstV2.poolAddress;
        } else if (poolInput) {
          poolInput.value = '';
        }

        matchPoolFromSelectedTokens(false);
      }

      function matchPoolFromSelectedTokens(overwriteInput = true) {
        const tokenInAddr = document.getElementById('tokenInAddr').value.trim();
        const tokenOutAddr = document.getElementById('tokenOutAddr').value.trim();
        const poolSelect = document.getElementById('poolPresetSelect');
        const poolInput = document.getElementById('poolAddr');
        const statusEl = document.getElementById('poolJsonStatus');

        const symIn = getTokenSymbolByAddress(activeChainId, tokenInAddr).toUpperCase();
        const symOut = getTokenSymbolByAddress(activeChainId, tokenOutAddr).toUpperCase();
        const entries = poolsByChain[String(activeChainId)] || poolsByChain[activeChainId] || [];

        const matched = entries.find((entry) => {
          const parts = (entry.pair || '').split('/')[0]
            ? entry.pair.split(' ')[0].split('/').map((s) => s.trim().toUpperCase())
            : [];
          if (parts.length !== 2 || !symIn || !symOut) return false;
          const [a, b] = parts;
          const matchA = a === symIn || (a === 'WBNB' && symIn === 'BNB') || (a === 'BNB' && symIn === 'WBNB') || (a === 'WPOL' && symIn === 'POL') || (a === 'POL' && symIn === 'WPOL') || (a === 'EURE' && symIn === 'EURC') || (a === 'EURC' && symIn === 'EURE');
          const matchB = b === symOut || (b === 'WBNB' && symOut === 'BNB') || (b === 'BNB' && symOut === 'WBNB') || (b === 'WPOL' && symOut === 'POL') || (b === 'POL' && symOut === 'WPOL') || (b === 'EURE' && symOut === 'EURC') || (b === 'EURC' && symOut === 'EURE');
          const revA = a === symOut || (a === 'WBNB' && symOut === 'BNB') || (a === 'BNB' && symOut === 'WBNB') || (a === 'WPOL' && symOut === 'POL') || (a === 'POL' && symOut === 'WPOL') || (a === 'EURE' && symOut === 'EURC') || (a === 'EURC' && symOut === 'EURE');
          const revB = b === symIn || (b === 'WBNB' && symIn === 'BNB') || (b === 'BNB' && symIn === 'WBNB') || (b === 'WPOL' && symIn === 'POL') || (b === 'POL' && symIn === 'WPOL') || (b === 'EURE' && symIn === 'EURC') || (b === 'EURC' && symIn === 'EURE');
          return (matchA && matchB) || (revA && revB);
        });

        if (matched) {
          if (overwriteInput && poolInput) {
            poolInput.value = matched.poolAddress || '';
          }
          if (poolSelect && matched.poolAddress) {
            poolSelect.value = matched.poolAddress;
          }
          if (statusEl) {
            if (matched.poolAddress && matched.poolAddress.length === 42) {
              statusEl.textContent = `pools.json [${activeChainId}]: ${matched.pair} (${matched.dex || matched.type}) -> 20-byte V2 pool`;
              statusEl.className = 'text-xs font-mono text-emerald-400';
            } else {
              statusEl.textContent = `pools.json [${activeChainId}]: ${matched.pair} is ${matched.type} (66-char ID; not a 20-byte V2 pool for swapDirect)`;
              statusEl.className = 'text-xs font-mono text-amber-400';
            }
          }
        } else if (statusEl) {
          statusEl.textContent = `No pair entry in pools.json [${activeChainId}] for ${symIn || 'In'}/${symOut || 'Out'}; select or paste a 20-byte V2 pool.`;
          statusEl.className = 'text-xs font-mono text-slate-400';
        }

        if (typeof window.recalculateMinOut === 'function') {
          window.recalculateMinOut();
        }
      }

      async function fetchPoolsJson(logResult = false) {
        const statusEl = document.getElementById('poolJsonStatus');
        try {
          const resp = await fetch(`${POOLS_JSON_URL}?t=${Date.now()}`, { cache: 'no-store' });
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const json = await resp.json();
          if (json && typeof json === 'object') {
            poolsByChain = json;
            populatePoolDropdown(activeChainId);
            if (logResult) window.logMessage('[POOLS] Loaded pools.json from GitHub.');
          }
        } catch (err) {
          poolsByChain = FALLBACK_POOLS_JSON;
          populatePoolDropdown(activeChainId);
          if (statusEl) {
            statusEl.textContent = `Using fallback pool list (${err.message})`;
            statusEl.className = 'text-xs font-mono text-amber-400';
          }
          if (logResult) window.logMessage(`[POOLS] Fallback active (${err.message}).`);
        }
      }

      function populateChainUI(chainId) {
        const numericChain = Number(chainId) === 137 ? 137 : Number(chainId) === 1 ? 1 : 56;
        activeChainId = numericChain;
        const tokens = TOKENS_BY_CHAIN[numericChain] || TOKENS_BY_CHAIN[56];
        const routerAddr = ROUTERS_BY_CHAIN[numericChain];

        const routerInput = document.getElementById('routerAddr');
        if (routerInput && routerAddr) {
          routerInput.value = routerAddr;
        }

        const tokenInSelect = document.getElementById('tokenInSelect');
        const tokenOutSelect = document.getElementById('tokenOutSelect');
        const tokenInCustom = document.getElementById('tokenInAddr');
        const tokenOutCustom = document.getElementById('tokenOutAddr');

        if (tokenInSelect && tokenOutSelect) {
          tokenInSelect.innerHTML = '';
          tokenOutSelect.innerHTML = '';

          tokens.forEach((t) => {
            const label = `${t.symbol} (${t.address === 'NATIVE' ? 'Gas' : t.address.slice(0, 6) + '...' + t.address.slice(-4)})`;
            const optIn = document.createElement('option');
            optIn.value = t.address;
            optIn.textContent = label;
            tokenInSelect.appendChild(optIn);

            const optOut = document.createElement('option');
            optOut.value = t.address;
            optOut.textContent = label;
            tokenOutSelect.appendChild(optOut);
          });

          tokenInSelect.selectedIndex = 0;
          tokenOutSelect.selectedIndex = tokens.length > 2 ? 2 : 0;

          if (tokenInCustom && tokens[0]) tokenInCustom.value = tokens[0].address;
          if (tokenOutCustom && tokens[2]) tokenOutCustom.value = tokens[2].address;
        }

        populatePoolDropdown(numericChain);
      }

      // Helper to programmatically switch chains from anywhere in your app
      window.switchChain = async (chainId) => {
        const targetNetwork = NETWORKS[Number(chainId)];
        const statusEl = document.getElementById('status-msg');
        if (!targetNetwork) return;

        try {
          await modal.switchNetwork(targetNetwork);
          populateChainUI(chainId);
          if (statusEl) {
            statusEl.textContent = `Switched to ${targetNetwork.name}`;
            statusEl.className = 'text-xs font-mono text-emerald-400';
          }
          window.logMessage(`[NET] Switched to ${targetNetwork.name} (${chainId})`);
        } catch (err) {
          console.error('Chain switch failed:', err);
          if (statusEl) {
            statusEl.textContent = `Switch failed: ${err.message || 'User rejected'}`;
            statusEl.className = 'text-xs font-mono text-rose-400';
          }
        }
      };

      window.addEventListener('DOMContentLoaded', async () => {
        populateChainUI(56);
        await fetchPoolsJson(false);

        const connectBtn = document.getElementById('connect-wallet');
        const disconnectBtn = document.getElementById('disconnect-wallet');
        const chainSelect = document.getElementById('chain-select');
        const tokenInSelect = document.getElementById('tokenInSelect');
        const tokenOutSelect = document.getElementById('tokenOutSelect');
        const tokenInAddr = document.getElementById('tokenInAddr');
        const tokenOutAddr = document.getElementById('tokenOutAddr');
        const poolPresetSelect = document.getElementById('poolPresetSelect');
        const poolAddr = document.getElementById('poolAddr');
        const amountIn = document.getElementById('amountIn');
        const slippagePct = document.getElementById('slippagePct');
        const reloadPoolsBtn = document.getElementById('reloadPoolsBtn');

        if (connectBtn) {
          connectBtn.hidden = false;
          connectBtn.addEventListener('click', () => modal.open());
        }

        if (disconnectBtn) {
          disconnectBtn.addEventListener('click', async () => {
            await modal.disconnect();
          });
        }

        if (chainSelect) {
          chainSelect.addEventListener('change', (e) => {
            window.switchChain(e.target.value);
          });
        }

        if (tokenInSelect) {
          tokenInSelect.addEventListener('change', (e) => {
            tokenInAddr.value = e.target.value;
            matchPoolFromSelectedTokens(true);
          });
        }

        if (tokenOutSelect) {
          tokenOutSelect.addEventListener('change', (e) => {
            tokenOutAddr.value = e.target.value;
            matchPoolFromSelectedTokens(true);
          });
        }

        tokenInAddr.addEventListener('input', () => matchPoolFromSelectedTokens(false));
        tokenOutAddr.addEventListener('input', () => matchPoolFromSelectedTokens(false));

        if (poolPresetSelect) {
          poolPresetSelect.addEventListener('change', (e) => {
            if (e.target.value) {
              poolAddr.value = e.target.value;
              if (typeof window.recalculateMinOut === 'function') window.recalculateMinOut();
            }
          });
        }

        poolAddr.addEventListener('input', () => {
          if (typeof window.recalculateMinOut === 'function') window.recalculateMinOut();
        });
        amountIn.addEventListener('input', () => {
          if (typeof window.recalculateMinOut === 'function') window.recalculateMinOut();
        });
        slippagePct.addEventListener('change', () => {
          if (typeof window.recalculateMinOut === 'function') window.recalculateMinOut();
        });
        reloadPoolsBtn.addEventListener('click', () => fetchPoolsJson(true));
      });

      // Keep UI in sync with wallet connection state
      modal.subscribeAccount((state) => {
        const connectBtn = document.getElementById('connect-wallet');
        const disconnectBtn = document.getElementById('disconnect-wallet');
        const chainSelect = document.getElementById('chain-select');
        const addressEl = document.getElementById('wallet-address');
        const statusEl = document.getElementById('status-msg');

        if (state.isConnected && state.address) {
          window.userAddress = state.address;

          if (connectBtn) {
            connectBtn.textContent = `${state.address.slice(0, 6)}...${state.address.slice(-4)}`;
            connectBtn.className =
              'px-5 py-2.5 rounded-xl font-semibold bg-slate-800 text-emerald-400 border border-slate-700 cursor-pointer transition';
          }

          if (disconnectBtn) disconnectBtn.hidden = false;
          if (chainSelect) chainSelect.hidden = false;

          if (addressEl) {
            addressEl.textContent = `Connected: ${state.address}`;
            addressEl.hidden = false;
          }

          const accountKey = `${state.address.toLowerCase()}:${state.chainId || ''}`;
          if (accountKey !== lastLoggedAccountKey) {
            lastLoggedAccountKey = accountKey;
            window.logMessage(`[WALLET] Connected: ${state.address}`);
            if (typeof window.recalculateMinOut === 'function') window.recalculateMinOut();
          }
        } else {
          window.userAddress = null;

          if (connectBtn) {
            connectBtn.textContent = 'Connect Wallet';
            connectBtn.className =
              'px-5 py-2.5 rounded-xl font-semibold bg-white text-slate-950 hover:bg-slate-200 cursor-pointer transition';
          }

          if (disconnectBtn) disconnectBtn.hidden = true;
          if (chainSelect) chainSelect.hidden = true;

          if (addressEl) {
            addressEl.textContent = '';
            addressEl.hidden = true;
          }

          if (statusEl) statusEl.textContent = '';

          if (lastLoggedAccountKey !== '') {
            lastLoggedAccountKey = '';
            window.logMessage('[WALLET] Disconnected.');
          }
        }
      });

      // Keep dropdown & router synced if user switches networks inside their wallet
      modal.subscribeNetwork((networkState) => {
        const chainSelect = document.getElementById('chain-select');
        if (networkState?.chainId && NETWORKS[networkState.chainId]) {
          if (chainSelect) {
            chainSelect.value = String(networkState.chainId);
          }
          populateChainUI(networkState.chainId);
        }
      });
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8 font-sans">
    <div class="max-w-3xl mx-auto space-y-6">
      <!-- Header with Reown Wallet Connect, Chain Switcher & Disconnect -->
      <header class="flex flex-wrap items-center justify-between gap-4 bg-slate-900 border border-slate-800 rounded-2xl p-5">
        <div>
          <h1 class="text-xl font-bold text-white">Roton Router Testbench</h1>

      <!-- Swap Testbench Card -->

            <button

          id="consoleLog"

    <!-- Roton Router Execution, Pool Inspection & Automatic Slippage Script -->
    <script type="module">
      import { Contract, parseUnits, formatUnits } from 'https://esm.sh/ethers@6.13.0';

      function getWalletContext() {
        const modal = window.appKitModal;
        const walletProvider = modal?.getWalletProvider();
        const userAddress = window.userAddress || modal?.getAddress();
        if (!walletProvider || !userAddress) {
          window.logMessage('[WARN] Please connect your wallet first.');
          if (modal) modal.open();
          return null;
        }
        return { walletProvider, userAddress };
      }

      async function computeSlippageQuote(provider, poolAddr, tokenInAddr, tokenOutAddr, humanAmountIn, slippageVal) {
        if (!poolAddr || poolAddr.length !== 42) {
          throw new Error('Pool address must be a 20-byte V2 contract address (42 chars).');
        }
        if (!tokenInAddr || tokenInAddr === 'NATIVE' || !tokenOutAddr || tokenOutAddr === 'NATIVE') {
          throw new Error('Select ERC-20 tokens (wrap native gas to WBNB/WPOL first).');
        }
        if (!humanAmountIn || Number(humanAmountIn) <= 0) {
          throw new Error('Enter a valid positive Amount In.');
        }

        const tokenInContract = new Contract(tokenInAddr, window.ERC20_ABI, provider);
        const tokenOutContract = new Contract(tokenOutAddr, window.ERC20_ABI, provider);
        const pool = new Contract(poolAddr, window.V2_POOL_ABI, provider);

        const [decIn, decOut, t0, t1, reserves] = await Promise.all([
          tokenInContract.decimals().catch(() => 18),
          tokenOutContract.decimals().catch(() => 18),
          pool.token0(),
          pool.token1(),
          pool.getReserves()
        ]);

        const amountInWei = parseUnits(String(humanAmountIn), Number(decIn));
        // 5 bps (0.05%) router fee before V2 constant-product math
        const amountToSwap = amountInWei - (amountInWei * 5n) / 10000n;

        const inLower = tokenInAddr.toLowerCase();
        const outLower = tokenOutAddr.toLowerCase();
        const t0Lower = t0.toLowerCase();
        const t1Lower = t1.toLowerCase();

        if (inLower !== t0Lower && inLower !== t1Lower) {
          throw new Error('Token In does not match token0 or token1 of this V2 pool.');
        }
        if (outLower !== t0Lower && outLower !== t1Lower) {
          throw new Error('Token Out does not match token0 or token1 of this V2 pool.');
        }
        if (inLower === outLower) {
          throw new Error('Token In and Token Out must be different.');
        }

        const isToken0 = inLower === t0Lower;
        const reserveIn = BigInt(isToken0 ? reserves[0] : reserves[1]);
        const reserveOut = BigInt(isToken0 ? reserves[1] : reserves[0]);

        const amountInWithFee = amountToSwap * 997n;
        const expectedOutWei =
          (amountInWithFee * reserveOut) / (reserveIn * 1000n + amountInWithFee);

        const bps = Number(slippageVal) === 2 ? 200n : 100n;
        const minAmountOutWei = (expectedOutWei * (10000n - bps)) / 10000n;

        return {
          amountInWei,
          expectedOutWei,
          minAmountOutWei,
          expectedOutFormatted: formatUnits(expectedOutWei, Number(decOut)),
          minAmountOutFormatted: formatUnits(minAmountOutWei, Number(decOut)),
          slippagePct: Number(slippageVal) === 2 ? 2 : 1
        };
      }

      window.recalculateMinOut = async function () {
        const minOutInput = document.getElementById('minAmountOut');
        const summaryEl = document.getElementById('quoteSummary');
        const modal = window.appKitModal;
        const walletProvider = modal?.getWalletProvider();

        const poolAddr = document.getElementById('poolAddr').value.trim();
        const tokenInAddr = document.getElementById('tokenInAddr').value.trim();
        const tokenOutAddr = document.getElementById('tokenOutAddr').value.trim();
        const humanAmountIn = document.getElementById('amountIn').value.trim();
        const slippageVal = document.getElementById('slippagePct').value;

        if (!walletProvider || !poolAddr || poolAddr.length !== 42) {
          return;
        }

        try {
          const provider = new window.BrowserProvider(walletProvider);
          const quote = await computeSlippageQuote(
            provider,
            poolAddr,
            tokenInAddr,
            tokenOutAddr,
            humanAmountIn,
            slippageVal
          );
          minOutInput.value = quote.minAmountOutWei.toString();
          summaryEl.textContent = `Est. Out: ${Number(quote.expectedOutFormatted).toFixed(6)} | Min Out (${quote.slippagePct}% slippage): ${Number(quote.minAmountOutFormatted).toFixed(6)} (${quote.minAmountOutWei.toString()} wei)`;
          summaryEl.className = 'text-xs font-mono text-emerald-400';
        } catch (err) {
          summaryEl.textContent = `Quote info: ${err.shortMessage || err.message}`;
          summaryEl.className = 'text-xs font-mono text-slate-400';
        }
      };

      document.getElementById('wrapNativeBtn').addEventListener('click', async () => {
        const ctx = getWalletContext();
        if (!ctx) return;
        const humanAmountIn = document.getElementById('amountIn').value.trim() || '0.01';

        try {
          const provider = new window.BrowserProvider(ctx.walletProvider);
          const signer = await provider.getSigner();
          const network = await provider.getNetwork();
          const chainId = Number(network.chainId);

          const wrappedAddr =
            chainId === 137
              ? '0x0d500B1d8E8eF31E21C99d1Db9A6444d3ADf1270'
              : '0xbb4CdB9CBd36B01bD1cBaEBF2De08d9173bc095c';

          const wethContract = new Contract(
            wrappedAddr,
            ['function deposit() payable external'],
            signer
          );
          const weiVal = parseUnits(humanAmountIn, 18);
          window.logMessage(`[WRAP] Wrapping ${humanAmountIn} native gas into ${wrappedAddr}...`);
          const tx = await wethContract.deposit({ value: weiVal });
          window.logMessage(`[WRAP] Tx sent: ${tx.hash}`);
          await tx.wait();
          window.logMessage('[WRAP] Wrapped successfully.');
          await window.recalculateMinOut();
        } catch (err) {
          window.logMessage(`[ERROR] Wrap failed: ${err.shortMessage || err.message}`);
        }
      });

      document.getElementById('inspectPoolBtn').addEventListener('click', async () => {
        const ctx = getWalletContext();
        if (!ctx) return;
        const poolAddr = document.getElementById('poolAddr').value.trim();
        const tokenInAddr = document.getElementById('tokenInAddr').value.trim();

        if (!poolAddr || poolAddr.length !== 42) {
          window.logMessage('[WARN] Enter a valid 20-byte V2 pool address (42 chars) to inspect.');
          return;
        }

        try {
          const provider = new window.BrowserProvider(ctx.walletProvider);
          const pool = new Contract(poolAddr, window.V2_POOL_ABI, provider);
          const [t0, t1, reserves] = await Promise.all([
            pool.token0(),
            pool.token1(),
            pool.getReserves()
          ]);
          const c0 = new Contract(t0, ['function symbol() view returns (string)'], provider);
          const c1 = new Contract(t1, ['function symbol() view returns (string)'], provider);
          const [s0, s1] = await Promise.all([
            c0.symbol().catch(() => t0.slice(0, 8)),
            c1.symbol().catch(() => t1.slice(0, 8))
          ]);

          window.logMessage(`[POOL] token0: ${s0} (${t0}) | token1: ${s1} (${t1})`);
          window.logMessage(`[POOL] reserves: r0=${reserves[0].toString()} | r1=${reserves[1].toString()}`);

          if (tokenInAddr && tokenInAddr !== 'NATIVE') {
            const match =
              t0.toLowerCase() === tokenInAddr.toLowerCase() ||
              t1.toLowerCase() === tokenInAddr.toLowerCase();
            window.logMessage(
              match
                ? '[POOL] Selected Token In matches one of the pool tokens.'
                : '[WARN] Selected Token In is NOT token0 or token1 of this pool!'
            );
          }

          await window.recalculateMinOut();
        } catch (err) {
          window.logMessage(`[ERROR] Pool inspection failed: ${err.shortMessage || err.message}`);
        }
      });

      document.getElementById('execBtn').addEventListener('click', async () => {
        const ctx = getWalletContext();
        if (!ctx) return;

        const routerAddr = document.getElementById('routerAddr').value.trim();
        const poolAddr = document.getElementById('poolAddr').value.trim();
        const tokenInAddr = document.getElementById('tokenInAddr').value.trim();
        const tokenOutAddr = document.getElementById('tokenOutAddr').value.trim();
        const humanAmountIn = document.getElementById('amountIn').value.trim();
        const slippageVal = document.getElementById('slippagePct').value;

        if (tokenInAddr === 'NATIVE') {
          window.logMessage(
            '[WARN] Token In is NATIVE gas. Click "Wrap Native Gas" first or select WBNB / WPOL.'
          );
          return;
        }

        if (!poolAddr || poolAddr.length !== 42) {
          window.logMessage(
            '[WARN] Pool address must be a 20-byte V2 pair address (42 chars). 32-byte Pool IDs cannot be passed to swapDirect.'
          );
          return;
        }

        try {
          const provider = new window.BrowserProvider(ctx.walletProvider);
          const signer = await provider.getSigner();
          const network = await provider.getNetwork();
          window.logMessage(`[NET] Chain ID: ${network.chainId.toString()} | Router: ${routerAddr}`);

          const quote = await computeSlippageQuote(
            provider,
            poolAddr,
            tokenInAddr,
            tokenOutAddr,
            humanAmountIn,
            slippageVal
          );

          document.getElementById('minAmountOut').value = quote.minAmountOutWei.toString();
          window.logMessage(
            `[QUOTE] Est. Out: ${quote.expectedOutFormatted} | Min Out (${quote.slippagePct}%): ${quote.minAmountOutFormatted} (${quote.minAmountOutWei.toString()} wei)`
          );

          const tokenIn = new Contract(tokenInAddr, window.ERC20_ABI, signer);
          let decimals = 18;
          try {
            decimals = await tokenIn.decimals();
          } catch (_) {
            window.logMessage('[INFO] Could not read decimals(), defaulting to 18.');
          }

          const amountInWei = parseUnits(humanAmountIn, decimals);
          const bal = await tokenIn.balanceOf(ctx.userAddress);
          if (bal < amountInWei) {
            window.logMessage(
              `[WARN] Token In balance (${formatUnits(bal, decimals)}) is less than amountIn (${humanAmountIn}).`
            );
          }

          const currentAllowance = await tokenIn.allowance(ctx.userAddress, routerAddr);
          if (currentAllowance < amountInWei) {
            window.logMessage(`[APPROVE] Approving ${humanAmountIn} tokens for Router ${routerAddr}...`);
            const approveTx = await tokenIn.approve(routerAddr, amountInWei);
            window.logMessage(`[APPROVE] Tx sent: ${approveTx.hash}`);
            await approveTx.wait();
            window.logMessage('[APPROVE] Confirmed.');
          } else {
            window.logMessage('[APPROVE] Sufficient allowance already exists.');
          }

          const router = new Contract(routerAddr, window.ROTON_ROUTER_ABI, signer);
          window.logMessage(`[SWAP] Calling swapDirect on pool ${poolAddr}...`);
          const swapTx = await router.swapDirect(
            poolAddr,
            tokenInAddr,
            tokenOutAddr,
            amountInWei,
            quote.minAmountOutWei
          );
          window.logMessage(`[SWAP] Tx broadcast: ${swapTx.hash}`);
          const receipt = await swapTx.wait();
          window.logMessage(`[SUCCESS] Swap confirmed in block ${receipt.blockNumber}!`);
        } catch (err) {
          window.logMessage(`[ERROR] ${err.shortMessage || err.message}`);
        }
      });
    </script>
