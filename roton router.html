<script type="module">
  import { createAppKit } from 'https://esm.sh';
  import { EthersAdapter } from 'https://esm.sh';
  import { bsc, polygon } from 'https://esm.sh/networks';
  import {
    BrowserProvider,
    JsonRpcProvider,
    Contract,
    parseUnits,
    formatUnits
  } from 'https://esm.sh';

  const projectId = 'db6af3372f722385b2e4c5df24341c63';

  const modal = createAppKit({
    adapters: [new EthersAdapter()],
    networks: [bsc, polygon],
    defaultNetwork: bsc,
    projectId,
    metadata: {
      name: 'Roton Router Portal',
      description: 'Multi-chain V2 Direct Pool Swap',
      url: window.location.origin,
      icons: ['https://githubusercontent.com']
    }
  });

  const CHAINS = {
    bsc: {
      chainId: 56,
      hexChainId: '0x38',
      name: 'BNB Smart Chain',
      rpc: 'https://binance.org',
      router: '0x6c1F7E61Ce370414807e2a8Dd7a746F00dc7B56B',
      tokens: [
        { symbol: 'WBNB', address: '0xbb4CdB9CBd36B01bD1cBaEBF2De08d9173bc095c', decimals: 18 },
        { symbol: 'USDT', address: '0x55d398326f99059fF775485246999027B3197955', decimals: 18 },
        { symbol: 'USDC', address: '0x8AC76a51cc950d9822D68b83fE1Ad97B32Cd580d', decimals: 18 },
        { symbol: 'CAKE', address: '0x0E09FaBB73Bd3Ade0a17ECC321fD13a19e81cE82', decimals: 18 }
      ]
    },
    poly: {
      chainId: 137,
      hexChainId: '0x89',
      name: 'Polygon Mainnet',
      rpc: 'https://polygon-rpc.com',
      router: '0x7f1Aa65d88b3D62Ed5d782F7217c6FD6B036e781',
      tokens: [
        { symbol: 'WPOL (WMATIC)', address: '0x0d500B1d8E8eF31E21C99d1Db9A6444d3ADf1270', decimals: 18 },
        { symbol: 'USDT', address: '0xc2132D05D31c914a87C6611C10748AEb04B58e8F', decimals: 6 },
        { symbol: 'USDC.e', address: '0x2791Bca1f2de4661ED88A30C99A7a9449Aa84174', decimals: 6 },
        { symbol: 'USDC (Native)', address: '0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359', decimals: 6 },
        { symbol: 'WETH', address: '0x7ceB23fD6bC0adD59E62ac25578270cFf1b9f619', decimals: 18 }
      ]
    }
  };

  const ERC20_ABI = [
    'function balanceOf(address owner) view returns (uint256)',
    'function allowance(address owner, address spender) view returns (uint256)',
    'function approve(address spender, uint256 amount) returns (bool)'
  ];

  const ROTON_ROUTER_ABI = [
    'function swapDirect(address pool, address tokenIn, address tokenOut, uint256 amountIn, uint256 minAmountOut) external returns (uint256)'
  ];

  function log(msg) {
    const el = document.getElementById('consoleLog');
    el.innerHTML += `<br>[${new Date().toLocaleTimeString()}] ${msg}`;
    el.scrollTop = el.scrollHeight;
  }

  function initDropdowns(key) {
    const cfg = CHAINS[key];
    const selIn = document.getElementById(`${key}-token-in`);
    const selOut = document.getElementById(`${key}-token-out`);

    cfg.tokens.forEach((t) => {
      selIn.add(new Option(t.symbol, t.address));
      selOut.add(new Option(t.symbol, t.address));
    });
    selOut.selectedIndex = 1;

    selIn.addEventListener('change', () => refreshBalances(key));
    selOut.addEventListener('change', () => refreshBalances(key));
  }

  initDropdowns('bsc');
  initDropdowns('poly');

  async function refreshBalances(key) {
    const userAddress = modal.getAddress();
    if (!userAddress) return;

    const cfg = CHAINS[key];
    const rpcProvider = new JsonRpcProvider(cfg.rpc);
    const addrIn = document.getElementById(`${key}-token-in`).value;
    const addrOut = document.getElementById(`${key}-token-out`).value;

    const tokInObj = cfg.tokens.find(t => t.address === addrIn);
    const tokOutObj = cfg.tokens.find(t => t.address === addrOut);

    try {
      const cIn = new Contract(addrIn, ERC20_ABI, rpcProvider);
      const cOut = new Contract(addrOut, ERC20_ABI, rpcProvider);
      const [balIn, balOut] = await Promise.all([
        cIn.balanceOf(userAddress),
        cOut.balanceOf(userAddress)
      ]);
      document.getElementById(`${key}-bal-in`).innerText =
        `Balance: ${Number(formatUnits(balIn, tokInObj.decimals)).toFixed(4)} ${tokInObj.symbol}`;
      document.getElementById(`${key}-bal-out`).innerText =
        `Balance: ${Number(formatUnits(balOut, tokOutObj.decimals)).toFixed(4)} ${tokOutObj.symbol}`;
    } catch (e) {
      log(`[${cfg.name}] Balance read error: ${e.message}`);
    }
  }

  modal.subscribeProviders((state) => {
    const address = modal.getAddress();
    if (state['eip155'] && address) {
      log(`Connected via Reown: ${address}`);
      refreshBalances('bsc');
      refreshBalances('poly');
    }
  });

  window.executeRotonSwap = async (key) => {
    const eip155Provider = modal.getWalletProvider();
    const userAddress = modal.getAddress();
    if (!eip155Provider || !userAddress) {
      log('Please connect your wallet first.');
      return modal.open();
    }

    const cfg = CHAINS[key];
    const tokenIn = document.getElementById(`${key}-token-in`).value;
    const tokenOut = document.getElementById(`${key}-token-out`).value;
    const pool = document.getElementById(`${key}-pool`).value.trim();
    const humanAmtIn = document.getElementById(`${key}-amt-in`).value;
    const minOutRaw = document.getElementById(`${key}-min-out`).value || '1';

    if (tokenIn.toLowerCase() === tokenOut.toLowerCase()) {
      return log(`[ERROR] Token In and Token Out cannot be the same.`);
    }

    const tokInObj = cfg.tokens.find(t => t.address === tokenIn);

    try {
      log(`[${cfg.name}] Switching network to Chain ID ${cfg.chainId}...`);
      await eip155Provider.request({
        method: 'wallet_switchEthereumChain',
        params: [{ chainId: cfg.hexChainId }]
      });

      const provider = new BrowserProvider(eip155Provider);
      const signer = await provider.getSigner();
      const amountInWei = parseUnits(humanAmtIn.toString(), tokInObj.decimals);

      const erc20 = new Contract(tokenIn, ERC20_ABI, signer);
      const allowance = await erc20.allowance(userAddress, cfg.router);

      if (allowance < amountInWei) {
        log(`[${cfg.name}] Approving ${humanAmtIn} ${tokInObj.symbol} for ${cfg.router}...`);
        const appTx = await erc20.approve(cfg.router, amountInWei);
        log(`[${cfg.name}] Approval tx sent: ${appTx.hash}`);
        await appTx.wait();
        log(`[${cfg.name}] Approval confirmed!`);
      } else {
        log(`[${cfg.name}] Sufficient allowance already approved.`);
      }

      const router = new Contract(cfg.router, ROTON_ROUTER_ABI, signer);
      log(`[${cfg.name}] Calling swapDirect on pool ${pool}...`);
      const swapTx = await router.swapDirect(
        pool,
        tokenIn,
        tokenOut,
        amountInWei,
        BigInt(minOutRaw)
      );
      log(`[${cfg.name}] Swap tx broadcast: ${swapTx.hash}`);
      const receipt = await swapTx.wait();
      log(`[SUCCESS] Swap confirmed in block ${receipt.blockNumber}!`);

      refreshBalances(key);
    } catch (err) {
      log(`[ERROR - ${cfg.name}] ${err.shortMessage || err.message}`);
    }
  };
</script>
</body>
</html>
